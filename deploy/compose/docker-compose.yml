# 运行 Scion：PostgreSQL（Standard 档元数据库）+ SeaweedFS（S3 兼容对象存储）+ scion server，
# 可选区域缓存 scion cache。说明见 docs/guide/deploy.md。
#
#   docker compose -f deploy/compose/docker-compose.yml up -d --build
#   scn --endpoint http://localhost:7080 repo create demo
#
# 拉不到 Docker Hub 时用镜像站，例如
#   REGISTRY=docker.m.daocloud.io docker compose -f deploy/compose/docker-compose.yml up -d --build
name: scion

x-images:
  base: &rust-image ${REGISTRY:-docker.io}/library/rust:1.99-slim-bookworm
  runtime: &runtime-image ${REGISTRY:-docker.io}/library/debian:bookworm-slim

services:
  postgres:
    image: ${REGISTRY:-docker.io}/library/postgres:16
    environment:
      POSTGRES_USER: scion
      POSTGRES_PASSWORD: ${SCION_DB_PASSWORD:-scion-dev-secret}
      POSTGRES_DB: scion
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scion"]
      interval: 5s
      retries: 30

  s3:
    image: ${REGISTRY:-docker.io}/chrislusf/seaweedfs:4.48
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - ../dev/s3.json:/etc/seaweedfs/s3.json:ro
      - s3-data:/data
    healthcheck:
      test: ["CMD-SHELL", "echo 's3.bucket.list' | weed shell >/dev/null 2>&1"]
      interval: 5s
      retries: 30

  s3-init:
    image: ${REGISTRY:-docker.io}/chrislusf/seaweedfs:4.48
    depends_on:
      s3:
        condition: service_healthy
    # 幂等：bucket 已存在时创建会报错，以最后确认 bucket 存在为准
    entrypoint:
      - /bin/sh
      - -c
      - >-
        echo 's3.bucket.create -name scion-objects' | weed shell -master=s3:9333;
        echo 's3.bucket.list' | weed shell -master=s3:9333 | grep -q scion-objects

  scion:
    build:
      context: ../..
      args:
        RUST_IMAGE: *rust-image
        RUNTIME_IMAGE: *runtime-image
    image: ${SCION_IMAGE:-scion:dev}
    command: ["--log-format", "json", "server"]
    environment:
      SCION_LISTEN: 0.0.0.0:7080
      SCION_META: postgres://scion:${SCION_DB_PASSWORD:-scion-dev-secret}@postgres:5432/scion
      SCION_BLOBS: s3://scion-objects
      SCION_S3_ENDPOINT: http://s3:8333
      SCION_S3_ACCESS_KEY_ID: scion
      SCION_S3_SECRET_ACCESS_KEY: scion-dev-secret
      SCION_METRICS_LISTEN: 0.0.0.0:9464
    depends_on:
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    ports:
      - "7080:7080"   # gRPC
      - "9464:9464"   # /metrics
    healthcheck:
      test: ["CMD", "scn", "doctor", "--endpoint", "http://127.0.0.1:7080"]
      interval: 5s
      retries: 30

  # 区域缓存（可选）：docker compose ... --profile cache up -d
  cache:
    profiles: ["cache"]
    image: ${SCION_IMAGE:-scion:dev}
    command: ["--log-format", "json", "cache"]
    environment:
      SCION_CACHE_LISTEN: 0.0.0.0:7090
      SCION_CACHE_UPSTREAMS: http://scion:7080
      SCION_CACHE_MEMORY: 512MiB
      SCION_METRICS_LISTEN: 0.0.0.0:9464
    depends_on:
      scion:
        condition: service_healthy
    ports:
      - "7090:7090"
      - "9465:9464"

volumes:
  pg-data:
  s3-data:
