# 本地开发依赖：S3 兼容对象存储（SeaweedFS）与 PostgreSQL（Standard 档元数据库）。
#
#   docker compose -f deploy/dev/docker-compose.yml up -d
#
# 拉不到 Docker Hub 时，可以把镜像名换成镜像站地址，例如
#   docker.m.daocloud.io/chrislusf/seaweedfs:4.48、docker.m.daocloud.io/library/postgres:16
#
# 默认用 SeaweedFS：MinIO 开源版已归档、停止维护，官方不再提供社区版下载。
# Scion 只用 S3 核心子集，MinIO 同样支持，CI 中两者都测试。需要 MinIO 时（例如对齐 starhub 部署）：
#   docker compose -f deploy/dev/docker-compose.yml --profile minio up -d minio
# endpoint http://localhost:9000，access key scion / scion-dev-secret，bucket scion-objects。
name: scion-dev

services:
  s3:
    image: chrislusf/seaweedfs:4.48
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"   # S3 API：endpoint http://localhost:8333，access key scion / scion-dev-secret
    volumes:
      - ./s3.json:/etc/seaweedfs/s3.json:ro
      - s3-data:/data
    healthcheck:
      test: ["CMD-SHELL", "echo 's3.bucket.list' | weed shell >/dev/null 2>&1"]
      interval: 5s
      retries: 30

  s3-init:
    image: chrislusf/seaweedfs:4.48
    depends_on:
      s3:
        condition: service_healthy
    # 幂等：bucket 已存在时创建会报错，以最后确认 bucket 存在为准
    entrypoint:
      - /bin/sh
      - -c
      - >-
        echo 's3.bucket.create -name scion-objects' | weed shell -master=s3:9333;
        echo 's3.bucket.list' | weed shell -master=s3:9333 | grep -q scion-objects

  # starhub / CSGHub 部署使用的 MinIO 版本（bitnami 镜像，2023.12）
  minio:
    profiles: ["minio"]
    image: opencsg-registry.cn-beijing.cr.aliyuncs.com/opencsg_public/bitnami/minio:2023
    environment:
      MINIO_ROOT_USER: scion
      MINIO_ROOT_PASSWORD: scion-dev-secret
      MINIO_DEFAULT_BUCKETS: scion-objects
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 控制台
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/minio/health/ready"]
      interval: 5s
      retries: 30

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: scion
      POSTGRES_PASSWORD: scion-dev-secret
      POSTGRES_DB: scion
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scion"]
      interval: 5s
      retries: 20

volumes:
  s3-data:
  pg-data:
  minio-data:
