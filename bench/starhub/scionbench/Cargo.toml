[package]
name = "scionbench"
version = "0.1.0"
edition = "2024"
publish = false

# Not part of the main workspace: build with `cargo build --release` in this directory.
[workspace]

[dependencies]
scion-client = { path = "../../../client/sdk" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
bytes = "1"
futures = "0.3"
