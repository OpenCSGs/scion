syntax = "proto3";

package scion.v1;

// 哈希算法，取值与 SPEC.md §1 中 ObjectId 的 algo 字节一致。
enum HashAlgo {
  HASH_ALGO_UNSPECIFIED = 0;
  HASH_ALGO_BLAKE3_256 = 1;
}

// 对象类型，取值与 SPEC.md §1 中 ObjectId 的 kind 字节一致。
enum ObjectKind {
  OBJECT_KIND_UNSPECIFIED = 0;
  OBJECT_KIND_BLOB = 1;
  OBJECT_KIND_TREE = 2;
  OBJECT_KIND_CHANGESET = 3;
  OBJECT_KIND_CHUNK_LIST = 5;
}

// 传输时对象数据的编码。
enum Encoding {
  ENCODING_UNSPECIFIED = 0;
  // 原始字节。
  ENCODING_IDENTITY = 1;
  // zstd 压缩。仅当服务端声明 feature "objects.zstd" 时可用。
  ENCODING_ZSTD = 2;
}

// 错误原因。出错时放在 google.rpc.ErrorInfo.reason（字符串形式，即枚举名去掉 ERROR_REASON_ 前缀），
// domain 固定为 "scion.dev"。重试语义见服务端设计文档 §3.5。
enum ErrorReason {
  ERROR_REASON_UNSPECIFIED = 0;
  // 服务端 rebase 时与 ref 上的改动冲突。metadata：changeset（冲突的原提交）、count（冲突路径数），
  // 以及每个冲突（最多 32 个，N 从 0 开始）的 path.N、kind.N（content、add_add、modify_delete、
  // delete_modify、binary、too_large、symlink、path）和 base.N、ours.N、theirs.N（blob 文本 ID，
  // 该方没有文件时为空）。
  ERROR_REASON_MERGE_CONFLICT = 1;
  ERROR_REASON_LAND_CONTENTION = 2;
  ERROR_REASON_ALREADY_LANDED = 3;
  ERROR_REASON_REF_VERSION_MISMATCH = 4;
  ERROR_REASON_OBJECT_MISSING = 5;
  ERROR_REASON_REDACTED = 6;
  ERROR_REASON_RATE_LIMITED = 7;
  ERROR_REASON_REPO_NOT_FOUND = 8;
  ERROR_REASON_INVALID_OBJECT_ID = 9;
  ERROR_REASON_LIMIT_EXCEEDED = 10;
  // changeset 的 delta 无法应用到父提交上（删除不存在的文件、路径冲突等），metadata.path 为出错路径。
  ERROR_REASON_INVALID_CHANGESET = 11;
  // 只允许快进时，合入的 changeset 不是 ref 当前提交的后继，metadata.tip 为当前提交。
  ERROR_REASON_NOT_FAST_FORWARD = 12;
  ERROR_REASON_REF_NOT_FOUND = 13;
  ERROR_REASON_PATH_NOT_FOUND = 14;
  // 令牌已过期（UNAUTHENTICATED）。客户端用刷新凭据换一个新令牌后重试。
  ERROR_REASON_TOKEN_EXPIRED = 15;
  // 没有权限（PERMISSION_DENIED）。metadata：repo、action（read / write / land / admin），以及 ref、path（如有）。
  ERROR_REASON_PERMISSION_DENIED = 16;
  // 仓库名已被使用（ALREADY_EXISTS）。metadata.repo。
  ERROR_REASON_REPO_ALREADY_EXISTS = 17;
  // 仓库已删除、尚未清除，名字暂不能使用（ALREADY_EXISTS）。metadata.repo，可以用 RestoreRepo 恢复。
  ERROR_REASON_REPO_DELETED = 18;
}

// 目录条目类型，取值与 SPEC.md §4 的 mode 字节一致。
enum EntryMode {
  ENTRY_MODE_UNSPECIFIED = 0;
  ENTRY_MODE_FILE = 1;
  ENTRY_MODE_EXECUTABLE = 2;
  ENTRY_MODE_SYMLINK = 3;
  ENTRY_MODE_TREE = 4;
}

message TreeEntry {
  string name = 1;
  EntryMode mode = 2;
  // 34 字节 ObjectId。
  bytes id = 3;
  // 文件字节数；目录为 0。
  uint64 size = 4;
}
