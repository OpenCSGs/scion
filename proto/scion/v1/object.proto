syntax = "proto3";

package scion.v1;

import "scion/v1/common.proto";

// 对象读取。L1 / L2 / L3 三层都实现，是唯一可被缓存的服务。
service ObjectService {
  // 按 id 批量取对象。大对象分块流式返回；断开后用 ObjectWant.offset 续传。
  rpc GetObjects(GetObjectsRequest) returns (stream GetObjectsResponse);
  // 返回请求中服务端不存在的对象（FindMissing）。
  rpc HasObjects(HasObjectsRequest) returns (HasObjectsResponse);
  // 仓库中 redaction 的变化，按 seq 升序（缓存层与 daemon 增量同步，结果不缓存）。需要该仓库的读权限。
  rpc ListRedactedObjects(ListRedactedObjectsRequest) returns (ListRedactedObjectsResponse);
}

message ObjectWant {
  // 34 字节 ObjectId。
  bytes id = 1;
  // 从该字节偏移开始返回（续传用），0 表示从头开始。
  uint64 offset = 2;
}

message GetObjectsRequest {
  string repo = 1;
  repeated ObjectWant wants = 2;
  // 客户端可接受的编码；为空等价于只接受 ENCODING_IDENTITY。
  repeated Encoding accept_encodings = 3;
}

// 一个对象的一个分块。同一对象的分块按 offset 递增连续发送，最后一块 last=true。
message GetObjectsResponse {
  bytes id = 1;
  uint64 offset = 2;
  bytes data = 3;
  Encoding encoding = 4;
  bool last = 5;
  // 对象未压缩时的总字节数。
  uint64 total_size = 6;
}

message HasObjectsRequest {
  string repo = 1;
  repeated bytes ids = 2;
}

message HasObjectsResponse {
  // 请求中不存在的 id，保持请求中的相对顺序。
  repeated bytes missing_ids = 1;
}

message ListRedactedObjectsRequest {
  string repo = 1;
  // 只返回 seq 大于该值的变化；0 表示从头开始。
  uint64 after_seq = 2;
  // 0 表示服务端默认值。
  uint32 page_size = 3;
}

message RedactedObject {
  bytes id = 1;
  string redaction_id = 2;
  // false 表示已撤销，可以重新读取。
  bool active = 3;
  uint64 seq = 4;
}

message ListRedactedObjectsResponse {
  repeated RedactedObject objects = 1;
  // 下一次请求的 after_seq。
  uint64 next_seq = 2;
  // 还有更多变化（达到 page_size）。
  bool more = 3;
}
